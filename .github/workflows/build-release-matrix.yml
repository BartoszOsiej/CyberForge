name: build-release-matrix

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            ext: ""
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            ext: ""
          - os: macos-13
            target: x86_64-apple-darwin
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Build (netrecon + hashsleuth)
        run: |
          cargo build --release --target ${{ matrix.target }} -p netrecon
          cargo build --release --target ${{ matrix.target }} -p hashsleuth
      - name: Stage artifacts
        shell: bash
        run: |
          mkdir -p stage
          cp "target/${{ matrix.target }}/release/netrecon${{ matrix.ext }}" "stage/netrecon-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/hashsleuth${{ matrix.ext }}" "stage/hashsleuth-${{ matrix.target }}${{ matrix.ext }}"
      - name: Generate build provenance (SLSA v1 attestation)
        id: attest
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: |
            stage/netrecon-${{ matrix.target }}${{ matrix.ext }}
            stage/hashsleuth-${{ matrix.target }}${{ matrix.ext }}
      - name: Attach to release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          FILES="stage/*"
          if [ -n "$BUNDLE" ] && [ -f "$BUNDLE" ]; then FILES="$FILES $BUNDLE"; fi
          gh release upload "${{ github.ref_name }}" $FILES --clobber
