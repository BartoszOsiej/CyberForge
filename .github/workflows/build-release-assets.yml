name: build-release-assets

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libpcap-dev && rustup toolchain install stable
      - run: cargo build --release
      - name: Attach binaries
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/netrecon
            target/release/shadowscan
            target/release/hashsleuth
            target/release/packeteye
          generate_release_notes: true
